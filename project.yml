name: ComposersNotebook
options:
  bundleIdPrefix: com.timshega
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  VerovioToolkit:
    path: Vendor/verovio

targets:
  ComposersNotebook:
    type: application
    platform: iOS
    sources:
      - ComposersNotebook
    dependencies:
      - package: VerovioToolkit
        product: VerovioToolkit
    info:
      path: SupportFiles/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Bravura.otf
        NSMicrophoneUsageDescription: "Нужен доступ к микрофону для записи музыкальных идей"
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Composer's Notebook"
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.timshega.composersnotebook.cnb
          - CFBundleTypeName: MusicXML
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.xml
          - CFBundleTypeName: MIDI
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.midi-audio
          - CFBundleTypeName: Guitar Pro
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
            CFBundleTypeExtensions:
              - gp
              - gp5
              - gpx
          - CFBundleTypeName: ABC Notation
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
            CFBundleTypeExtensions:
              - abc
          - CFBundleTypeName: MEI
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.xml
            CFBundleTypeExtensions:
              - mei
          - CFBundleTypeName: Capella
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
            CFBundleTypeExtensions:
              - capx
          - CFBundleTypeName: PDF Score
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeDescription: "Composer's Notebook Document"
            UTTypeIdentifier: com.timshega.composersnotebook.cnb
            UTTypeTagSpecification:
              public.filename-extension:
                - cnb
    settings:
      base:
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.timshega.composersnotebook
        PRODUCT_NAME: "Composer's Notebook"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 65XX29Q6DL
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "Apple Development"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

  ComposersNotebookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ComposersNotebookTests
    dependencies:
      - target: ComposersNotebook
    settings:
      base:
        SWIFT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.timshega.composersnotebook.tests
        DEVELOPMENT_TEAM: 65XX29Q6DL
        CODE_SIGN_STYLE: Automatic
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
        # App PRODUCT_NAME is "Composer's Notebook" (with space/apostrophe), so the
        # host bundle/executable are not the target name. Point TEST_HOST at the real
        # product path or XcodeGen's target-name default ("ComposersNotebook.app") is wrong.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Composer's Notebook.app/Composer's Notebook"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ComposersNotebook:
    build:
      targets:
        ComposersNotebook: all
        ComposersNotebookTests: [test]
    test:
      config: Debug
      targets:
        - ComposersNotebookTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
